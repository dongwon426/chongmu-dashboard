<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>총무지원팀 업무 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #eef1f3;
    --surface: #ffffff;
    --surface-2: #f5f7f8;
    --ink: #16202c;
    --muted: #57636f;
    --line: #d7dee3;
    --accent: #8f6524;
    --accent-strong: #6f4e1a;
    --accent-tint: #f3e8d4;
    --good: #2f7d52;
    --good-tint: #e3f1e9;
    --info: #2f6fb0;
    --info-tint: #e4edf7;
    --warn: #b8862c;
    --warn-tint: #f7edd9;
    --bad: #b2432f;
    --bad-tint: #f8e7e2;
    --shadow: 0 1px 2px rgba(22,32,44,0.06), 0 8px 24px rgba(22,32,44,0.08);
    --font-ui: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "D2Coding", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151d;
      --surface: #161f2b;
      --surface-2: #1b2532;
      --ink: #e7ecf1;
      --muted: #94a2af;
      --line: #2b3648;
      --accent: #d3a557;
      --accent-strong: #e8c081;
      --accent-tint: #2c2417;
      --good: #55b384;
      --good-tint: #163326;
      --info: #6aa4e0;
      --info-tint: #182a3c;
      --warn: #d8ac57;
      --warn-tint: #332b17;
      --bad: #e07a63;
      --bad-tint: #34201b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151d;
    --surface: #161f2b;
    --surface-2: #1b2532;
    --ink: #e7ecf1;
    --muted: #94a2af;
    --line: #2b3648;
    --accent: #d3a557;
    --accent-strong: #e8c081;
    --accent-tint: #2c2417;
    --good: #55b384;
    --good-tint: #163326;
    --info: #6aa4e0;
    --info-tint: #182a3c;
    --warn: #d8ac57;
    --warn-tint: #332b17;
    --bad: #e07a63;
    --bad-tint: #34201b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  table { border-collapse: collapse; width: 100%; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-tint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Login screen ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      linear-gradient(180deg, transparent, transparent 39px, var(--line) 39px, var(--line) 40px) 0 0/100% 40px,
      var(--bg);
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 32px 28px 28px;
  }
  .login-logo {
    background: #fff;
    border-radius: 8px;
    padding: 9px 14px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  .login-logo img { display: block; height: 26px; width: auto; }
  .login-card h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .login-card .sub { color: var(--muted); font-size: 13px; margin: 6px 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    font-weight: 600; font-size: 13.5px;
    cursor: pointer;
    transition: filter 0.12s ease, background 0.12s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { filter: brightness(0.96); }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; padding: 10px 16px; margin-top: 4px; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; border-color: var(--line); color: var(--bad); }
  .btn-danger:hover { background: var(--bad-tint); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .login-error {
    display: none;
    background: var(--bad-tint); color: var(--bad);
    border-radius: 6px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px;
  }
  .login-hint { font-size: 11.5px; color: var(--muted); margin-top: 14px; text-align: center; }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.active { display: flex; }
  .topbar {
    height: 56px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-left .brand-logo { background: #fff; border-radius: 6px; padding: 4px 9px; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .topbar-left .brand-logo img { display: block; height: 17px; width: auto; }
  .topbar-left .titles { min-width: 0; }
  .topbar-left h1 { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .topbar-left .titles .ver { font-size: 11px; color: var(--muted); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--ink); font-weight: 600; }

  .shell { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 220px; flex: none;
    border-right: 1px solid var(--line);
    background: var(--surface);
    padding: 16px 10px;
    overflow-y: auto;
  }
  .nav-group + .nav-group { margin-top: 18px; }
  .nav-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 0 10px; margin-bottom: 6px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 6px;
    border: none; background: transparent; color: var(--ink);
    font-size: 13.5px; cursor: pointer;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
  .nav-item .count { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .nav-item.active .count { color: var(--accent-strong); }

  main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 28px 60px; }
  .view { display: none; max-width: 1180px; margin: 0 auto; }
  .view.active { display: block; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .view-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .view-head .desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .view-actions { display: flex; gap: 8px; }

  /* KPI cards */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .kpi-card .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi-card .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; margin-top: 6px; }
  .kpi-card .value .unit { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .kpi-card.info .value { color: var(--info); }
  .kpi-card.warn .value { color: var(--warn); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }

  /* category bar chart */
  .bar-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .bar-row .bar-label { width: 168px; flex: none; font-size: 12.5px; color: var(--ink); }
  .bar-track { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar-row .bar-value { width: 30px; flex: none; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  .activity-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .activity-item:first-child { border-top: none; }
  .activity-item .a-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); width: 76px; flex: none; }
  .activity-item .a-cat { color: var(--muted); }

  /* Category item cards */
  .item-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .item-head:hover { background: var(--surface-2); }
  .item-head .item-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .item-head .item-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .item-head .item-detail { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-head .item-right { display: flex; align-items: center; gap: 10px; flex: none; }
  .item-head .item-count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .chevron { transition: transform 0.15s ease; color: var(--muted); }
  .item-card.open .chevron { transform: rotate(90deg); }
  .item-body { display: none; border-top: 1px solid var(--line); padding: 4px 16px 14px; }
  .item-card.open .item-body { display: block; }

  /* status pill */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.st-대기 { background: var(--surface-2); color: var(--muted); }
  .pill.st-진행중 { background: var(--info-tint); color: var(--info); }
  .pill.st-완료 { background: var(--good-tint); color: var(--good); }
  .pill.st-보류 { background: var(--warn-tint); color: var(--warn); }

  /* filters */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .filter-field { display: flex; flex-direction: column; gap: 5px; }
  .filter-field label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .filter-field input, .filter-field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 120px; }
  .filter-field.grow input { min-width: 200px; }

  /* table */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  table.records th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.records td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  table.records tr:last-child td { border-bottom: none; }
  table.records tr:hover td { background: var(--surface-2); }
  .cell-title { font-weight: 600; }
  .cell-memo { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* modal */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,21,29,0.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.active { display: flex; }
  .modal { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 22px 24px; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(0); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .file-input { display: none; }

  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 10px; gap: 4px; }
    .nav-group { display: contents; }
    .nav-label { display: none; }
    .nav-item { flex: none; white-space: nowrap; }
    main { padding: 18px 16px 48px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>

          <label for="f-item">상세업무</label>
          <select id="f-item" required></select>
        </div>
      </div>
      <div class="field">
        <label for="f-title">제목</label>
        <input id="f-title" type="text" placeholder="예: 3층 정수기 렌탈 계약 갱신" required />
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-date">날짜</label>
          <input id="f-date" type="date" required />
        </div>
        <div class="field">
          <label for="f-status">상태</label>
          <select id="f-status">
            <option>대기</option>
            <option>진행중</option>
            <option>완료</option>
            <option>보류</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-assignee">담당자</label>
          <input id="f-assignee" type="text" required />
        </div>
        <div class="field">
          <label for="f-amount">금액 (원, 선택)</label>
          <input id="f-amount" type="number" min="0" step="1" placeholder="비용 관련 항목에 입력" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-quantity">수량 (선택)</label>
          <input id="f-quantity" type="number" min="0" step="1" placeholder="자산·비품 관련 항목에 입력" />
        </div>
        <div class="field">
          <label for="f-site">현장명 (선택)</label>
          <input id="f-site" type="text" placeholder="현장 관련 항목에 입력" />
        </div>
      </div>
      <div class="field">
        <label for="f-memo">메모</label>
        <textarea id="f-memo" rows="3" placeholder="세부 내용, 링크, 특이사항 등"></textarea>
      </div>
      <input type="hidden" id="f-id" />
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">취소</button>
        <button type="button" class="btn btn-danger" id="modal-delete" style="display:none;">삭제</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var TEAM_ID = "topec";
  var TEAM_PASSWORD = "topec123#";
  var SESSION_KEY = "chongmu.session";
  var RECORDS_KEY = "chongmu.records.v1";

  var memoryStore = {};
  var store = (function () {
    try {
      var testKey = "__chongmu_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return localStorage;
    } catch (e) {
      return {
        getItem: function (k) { return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null; },
        setItem: function (k, v) { memoryStore[k] = v; },
        removeItem: function (k) { delete memoryStore[k]; }
      };
    }
  })();

  var CATEGORIES = [
    { id: "asset", name: "자산 관리 업무", items: [
      { id: "asset-building", name: "건물(임대) 관리", detail: "계약 및 임대료 청구 관리" },
      { id: "asset-vehicle", name: "차량관리", detail: "본사 및 현장 업무 차량 계약 및 관리" },
      { id: "asset-facility", name: "시설 계약 및 유지 관리", detail: "전력, 통신, 보안, 주차 등" },
      { id: "asset-equipment", name: "임대장비 계약 및 유지 관리", detail: "복합기, 정수기, 공기청정기 등" },
      { id: "asset-fire", name: "방화관리", detail: "방화관리자의 업무(토펙빌딩)" }
    ]},
    { id: "event", name: "행사 지원 업무", items: [
      { id: "event-opening", name: "시무식·종무식", detail: "계획 및 지원" },
      { id: "event-workshop", name: "한마음 단합대회", detail: "행사계획 및 지원" },
      { id: "event-anniversary", name: "창립기념일 행사", detail: "계획 및 지원" },
      { id: "event-danjang", name: "단장회의 업무지원", detail: "상, 하반기" },
      { id: "event-yearend", name: "연말 송년행사", detail: "계획 및 지원" }
    ]},
    { id: "welfare", name: "복리후생 업무", items: [
      { id: "welfare-condolence", name: "경조사 지원 및 관리", detail: "화환 및 상조용품 발송·유지관리" },
      { id: "welfare-scholarship", name: "임직원 자녀 학자금 지원", detail: "" },
      { id: "welfare-checkup", name: "임직원 법정 건강검진 관리", detail: "" },
      { id: "welfare-birthday", name: "매월 생일자 선물", detail: "발송 및 관리" },
      { id: "welfare-anniversarygift", name: "기념일 선물지급 관리", detail: "명절, 창립기념일, 초복 등" },
      { id: "welfare-club", name: "동호회 개설 지원", detail: "개설 및 회비 지원" }
    ]},
    { id: "site", name: "본사 및 현장 지원업무", items: [
      { id: "site-exec", name: "경영층 보좌 및 홍보물 제작", detail: "관리 업무" },
      { id: "site-fieldopen", name: "현장 개설 및 지원", detail: "사무실임대, 집기, 현장개설비, 통신, 보안 등" },
      { id: "site-personnel", name: "인력 및 시설 관리", detail: "경비, 미화 등" },
      { id: "site-seal", name: "법인 인장 관리", detail: "등록 및 폐기" },
      { id: "site-furniture", name: "집기 비품", detail: "구입 및 유지관리" },
      { id: "site-supplies", name: "사무용품", detail: "구입 및 배포 업무" },
      { id: "site-businesscard", name: "명함제작", detail: "및 배포 업무" },
      { id: "site-access", name: "건물 출입자 관리", detail: "출입 등록 및 해제" },
      { id: "site-yearplan", name: "연간 행사 계획표", detail: "작성 및 배포" },
      { id: "site-uniform", name: "유니폼", detail: "제작 및 지급 업무" },
      { id: "site-diary", name: "다이어리", detail: "제작 및 배포 업무" },
      { id: "site-award", name: "상장", detail: "제작(발급) 및 관리" }
    ]},
    { id: "evoucher", name: "전자전표", items: [
      { id: "evoucher-basics", name: "전자전표의 이해", detail: "" },
      { id: "evoucher-personal", name: "개인경비", detail: "" },
      { id: "evoucher-tax", name: "세금과공과", detail: "" },
      { id: "evoucher-etax", name: "전자세금계산서", detail: "" },
      { id: "evoucher-mtax", name: "수기세금계산서", detail: "" },
      { id: "evoucher-corpcard", name: "법인카드", detail: "" },
      { id: "evoucher-rejection", name: "전표반려 및 처리", detail: "" }
    ]}
  ];

  var STATUS_LIST = ["대기", "진행중", "완료", "보류"];

  var itemIndex = {};
  var categoryIndex = {};
  CATEGORIES.forEach(function (cat) {
    categoryIndex[cat.id] = cat;
    cat.items.forEach(function (it) { itemIndex[it.id] = { cat: cat, item: it }; });
  });

  var state = {
    records: [],
    activeView: "overview",
    filters: { q: "", category: "", assignee: "", status: "", from: "", to: "" },
    editingId: null,
    lockedCategory: null
  };

  function uid() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function fmtDate(iso) { return iso || "-"; }
  function fmtMoney(n) { return n === null || n === undefined || n === "" ? "-" : Number(n).toLocaleString("ko-KR"); }
  function esc(s) { return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function loadRecords() {
    try { return JSON.parse(store.getItem(RECORDS_KEY)) || []; } catch (e) { return []; }
  }
  function saveRecords() { store.setItem(RECORDS_KEY, JSON.stringify(state.records)); }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  /* ---------------- Login ---------------- */
  function getSession() {
    try { return JSON.parse(store.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function setSession(id) { store.setItem(SESSION_KEY, JSON.stringify({ id: id, at: Date.now() })); }
  function clearSession() { store.removeItem(SESSION_KEY); }

  function showApp(id) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").classList.add("active");
    document.getElementById("who-name").textContent = id;
    init();
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = document.getElementById("login-id").value.trim();
    var pw = document.getElementById("login-pw").value;
    var err = document.getElementById("login-error");
    if (id !== TEAM_ID || pw !== TEAM_PASSWORD) {
      err.style.display = "block";
      return;
    }
    err.style.display = "none";
    setSession(id);
    showApp(id);
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    clearSession();
    location.reload();
  });

  /* ---------------- Sidebar / navigation ---------------- */
  function buildSidebar() {
    var nav = document.getElementById("sidebar");
    var html = '<div class="nav-group"><div class="nav-label">현황</div>';
    html += navItem("overview", "개요", "");
    html += navItem("records", "전체 기록", state.records.length);
    html += "</div>";
    html += '<div class="nav-group"><div class="nav-label">업무 카테고리</div>';
    CATEGORIES.forEach(function (cat) {
      html += navItem("cat:" + cat.id, cat.name, countByCategory(cat.id));
    });
    html += "</div>";
    nav.innerHTML = html;
    nav.querySelectorAll(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () { setView(btn.getAttribute("data-nav")); });
    });
  }
  function navItem(key, label, count) {
    return '<button class="nav-item" data-nav="' + key + '"><span>' + esc(label) + "</span>" +
      (count !== "" ? '<span class="count">' + count + "</span>" : "") + "</button>";
  }

  function setView(key) {
    state.activeView = key;
    document.querySelectorAll(".nav-item").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-nav") === key);
    });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    if (key === "overview") {
      document.getElementById("view-overview").classList.add("active");
      renderOverview();
    } else if (key === "records") {
      document.getElementById("view-records").classList.add("active");
      renderRecordsView();
    } else if (key.indexOf("cat:") === 0) {
      var catId = key.slice(4);
      var el = document.getElementById("view-cat-" + catId);
      if (el) el.classList.add("active");
      renderCategoryView(catId);
    }
    window.scrollTo(0, 0);
  }

  /* ---------------- Overview ---------------- */
  function countByCategory(catId) {
    return state.records.filter(function (r) { return r.categoryId === catId; }).length;
  }

  function renderOverview() {
    var total = state.records.length;
    var inProgress = state.records.filter(function (r) { return r.status === "진행중"; }).length;
    var pending = state.records.filter(function (r) { return r.status === "대기" || r.status === "보류"; }).length;
    var thisMonth = todayISO().slice(0, 7);
    var monthAmount = state.records.filter(function (r) {
      return r.categoryId === "evoucher" && r.date && r.date.slice(0, 7) === thisMonth && r.amount;
    }).reduce(function (sum, r) { return sum + Number(r.amount || 0); }, 0);

    document.getElementById("kpi-row").innerHTML =
      kpiCard("총 기록", total, "건") +
      kpiCard("진행중", inProgress, "건", "info") +
      kpiCard("대기·보류", pending, "건", "warn") +
      kpiCard("이번 달 전자전표 금액", fmtMoney(monthAmount), "원");

    var maxCount = Math.max(1, CATEGORIES.map(function (c) { return countByCategory(c.id); }).reduce(function (a, b) { return Math.max(a, b); }, 0));
    document.getElementById("cat-bars").innerHTML = CATEGORIES.map(function (cat) {
      var c = countByCategory(cat.id);
      var pct = Math.round((c / maxCount) * 100);
      return '<div class="bar-row"><div class="bar-label">' + esc(cat.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-value num">' + c + "</div></div>";
    }).join("");

    var recent = state.records.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 6);
    document.getElementById("recent-activity").innerHTML = recent.length ? recent.map(function (r) {
      var meta = itemIndex[r.itemId];
      return '<div class="activity-item"><span class="a-date num">' + fmtDate(r.date) + '</span>' +
        '<span>' + esc(r.title) + '</span>' +
        '<span class="a-cat">· ' + esc(meta ? meta.cat.name : "") + '</span>' +
        '<span class="pill st-' + r.status + '">' + r.status + "</span></div>";
    }).join("") : '<div class="empty-state">아직 등록된 기록이 없습니다. "전체 기록"에서 첫 기록을 추가해보세요.</div>';
  }
  function kpiCard(label, value, unit, tone) {
    return '<div class="kpi-card' + (tone ? " " + tone : "") + '"><div class="label">' + esc(label) + '</div>' +
      '<div class="value num">' + value + '<span class="unit">' + unit + "</span></div></div>";
  }

  /* ---------------- Category views ---------------- */
  function buildCategoryViews() {
    var host = document.getElementById("category-views");
    host.innerHTML = CATEGORIES.map(function (cat) {
      return '<section class="view" id="view-cat-' + cat.id + '" data-view="cat:' + cat.id + '">' +
        '<div class="view-head"><div><h2>' + esc(cat.name) + '</h2><div class="desc">' + cat.items.length + '개 세부 업무</div></div></div>' +
        '<div id="items-' + cat.id + '"></div></section>';
    }).join("");
  }

  function renderCategoryView(catId) {
    var cat = categoryIndex[catId];
    var host = document.getElementById("items-" + catId);
    host.innerHTML = cat.items.map(function (item) {
      var records = state.records.filter(function (r) { return r.itemId === item.id; })
        .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      return '<div class="item-card" id="item-card-' + item.id + '">' +
        '<div class="item-head" data-toggle="' + item.id + '">' +
        '<div class="item-title"><span class="item-name">' + esc(item.name) + '</span>' +
        (item.detail ? '<span class="item-detail">' + esc(item.detail) + '</span>' : '') + '</div>' +
        '<div class="item-right"><span class="item-count">' + records.length + '건</span>' +
        '<button class="btn btn-ghost btn-sm" data-add="' + item.id + '">+ 기록</button>' +
        '<svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div></div>' +
        '<div class="item-body">' + (records.length ? recordsTableRows(records, true) : '<div class="empty-state">등록된 기록이 없습니다.</div>') + '</div>' +
        '</div>';
    }).join("");

    host.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-add]")) return;
        document.getElementById("item-card-" + el.getAttribute("data-toggle")).classList.toggle("open");
      });
    });
    host.querySelectorAll("[data-add]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openModal(null, { categoryId: catId, itemId: el.getAttribute("data-add") });
      });
    });
    bindRowActions(host);
  }

  function recordsTableRows(records, mini) {
    var rows = records.map(function (r) {
      return '<tr data-id="' + r.id + '">' +
        '<td class="num">' + fmtDate(r.date) + '</td>' +
        (mini ? '' : '<td>' + esc((itemIndex[r.itemId] || {}).cat ? itemIndex[r.itemId].cat.name : '') + '<br><span class="cell-memo">' + esc(itemIndex[r.itemId] ? itemIndex[r.itemId].item.name : '') + '</span></td>') +
        '<td class="cell-title">' + esc(r.title) + '</td>' +
        '<td>' + esc(r.assignee) + '</td>' +
        '<td><span class="pill st-' + r.status + '">' + r.status + '</span></td>' +
        '<td class="num">' + (r.amount ? fmtMoney(r.amount) : '-') + '</td>' +
        '<td class="num">' + (r.quantity !== "" && r.quantity !== null && r.quantity !== undefined ? r.quantity : '-') + '</td>' +
        '<td>' + esc(r.site || '-') + '</td>' +
        '<td class="cell-memo" title="' + esc(r.memo || '') + '">' + esc(r.memo || '-') + '</td>' +
        '<td><div class="row-actions">' +
        '<button class="icon-btn" data-edit="' + r.id + '" title="수정" aria-label="수정">' + iconEdit() + '</button>' +
        '<button class="icon-btn" data-del="' + r.id + '" title="삭제" aria-label="삭제">' + iconTrash() + '</button>' +
        '</div></td></tr>';
    }).join("");
    return '<table class="records"><thead><tr>' +
      '<th>날짜</th>' + (mini ? '' : '<th>카테고리/업무</th>') +
      '<th>제목</th><th>담당자</th><th>상태</th><th>금액</th><th>수량</th><th>현장</th><th>메모</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function iconEdit() { return '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11.3 2.3a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1 0 1.4l-7.6 7.6-3 .7.7-3 7.5-7.7Z" stroke="currentColor" stroke-width="1.3"/></svg>'; }
  function iconTrash() { return '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5 5 13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'; }

  function bindRowActions(scope) {
    scope.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); openModal(btn.getAttribute("data-edit")); });
    });
    scope.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-del");
        if (confirm("이 기록을 삭제할까요?")) {
          state.records = state.records.filter(function (r) { return r.id !== id; });
          saveRecords();
          refreshAll();
          toast("삭제했습니다.");
        }
      });
    });
  }

  /* ---------------- Records view ---------------- */
  function buildFilterBar() {
    var assignees = Array.from(new Set(state.records.map(function (r) { return r.assignee; }).filter(Boolean))).sort();
    var bar = document.getElementById("filter-bar");
    bar.innerHTML =
      '<div class="filter-field grow"><label>검색</label><input type="text" id="ff-q" placeholder="제목·메모 검색" value="' + esc(state.filters.q) + '" /></div>' +
      '<div class="filter-field"><label>카테고리</label><select id="ff-category">' +
        '<option value="">전체</option>' + CATEGORIES.map(function (c) { return '<option value="' + c.id + '"' + (state.filters.category === c.id ? " selected" : "") + '>' + esc(c.name) + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="filter-field"><label>담당자</label><select id="ff-assignee">' +
        '<option value="">전체</option>' + assignees.map(function (a) { return '<option value="' + esc(a) + '"' + (state.filters.assignee === a ? " selected" : "") + '>' + esc(a) + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="filter-field"><label>상태</label><select id="ff-status">' +
        '<option value="">전체</option>' + STATUS_LIST.map(function (s) { return '<option value="' + s + '"' + (state.filters.status === s ? " selected" : "") + '>' + s + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="filter-field"><label>시작일</label><input type="date" id="ff-from" value="' + state.filters.from + '" /></div>' +
      '<div class="filter-field"><label>종료일</label><input type="date" id="ff-to" value="' + state.filters.to + '" /></div>' +
      '<button class="btn btn-ghost btn-sm" id="ff-reset">초기화</button>';

    ["q", "category", "assignee", "status", "from", "to"].forEach(function (key) {
      var el = document.getElementById("ff-" + key);
      el.addEventListener("input", function () { state.filters[key] = el.value; renderRecordsTable(); });
      el.addEventListener("change", function () { state.filters[key] = el.value; renderRecordsTable(); });
    });
    document.getElementById("ff-reset").addEventListener("click", function () {
      state.filters = { q: "", category: "", assignee: "", status: "", from: "", to: "" };
      buildFilterBar();
      renderRecordsTable();
    });
  }

  function filteredRecords() {
    var f = state.filters;
    return state.records.filter(function (r) {
      if (f.q && (r.title + " " + (r.memo || "")).toLowerCase().indexOf(f.q.toLowerCase()) === -1) return false;
      if (f.category && r.categoryId !== f.category) return false;
      if (f.assignee && r.assignee !== f.assignee) return false;
      if (f.status && r.status !== f.status) return false;
      if (f.from && r.date && r.date < f.from) return false;
      if (f.to && r.date && r.date > f.to) return false;
      return true;
    }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
  }

  function renderRecordsView() { buildFilterBar(); renderRecordsTable(); }
  function renderRecordsTable() {
    var records = filteredRecords();
    var outer = document.getElementById("records-table-wrap");
    if (!records.length) {
      outer.innerHTML = '<div class="empty-state">조건에 맞는 기록이 없습니다.</div>';
      return;
    }
    outer.innerHTML = '<table class="records" id="records-table"></table>';
    var wrap = document.getElementById("records-table");
    wrap.innerHTML = recordsTableRows(records, false);
    bindRowActions(wrap);
  }

  /* ---------------- Modal (add/edit) ---------------- */
  function fillCategorySelect(lockCat) {
    var sel = document.getElementById("f-category");
    sel.innerHTML = CATEGORIES.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join("");
    if (lockCat) sel.value = lockCat;
  }
  function fillItemSelect(catId, selectedItem) {
    var sel = document.getElementById("f-item");
    var cat = categoryIndex[catId] || CATEGORIES[0];
    sel.innerHTML = cat.items.map(function (it) { return '<option value="' + it.id + '">' + esc(it.name) + '</option>'; }).join("");
    if (selectedItem) sel.value = selectedItem;
  }
  document.getElementById("f-category").addEventListener("change", function () { fillItemSelect(this.value); });

  function openModal(recordId, presetIds) {
    var form = document.getElementById("record-form");
    form.reset();
    document.getElementById("modal-delete").style.display = "none";

    if (recordId) {
      var r = state.records.find(function (x) { return x.id === recordId; });
      if (!r) return;
      document.getElementById("modal-title").textContent = "기록 수정";
      document.getElementById("modal-sub").textContent = itemIndex[r.itemId] ? itemIndex[r.itemId].cat.name + " · " + itemIndex[r.itemId].item.name : "";
      fillCategorySelect(r.categoryId);
      fillItemSelect(r.categoryId, r.itemId);
      document.getElementById("f-id").value = r.id;
      document.getElementById("f-title").value = r.title;
      document.getElementById("f-date").value = r.date;
      document.getElementById("f-status").value = r.status;
      document.getElementById("f-assignee").value = r.assignee;
      document.getElementById("f-amount").value = r.amount || "";
      document.getElementById("f-quantity").value = r.quantity || "";
      document.getElementById("f-site").value = r.site || "";
      document.getElementById("f-memo").value = r.memo || "";
      document.getElementById("modal-delete").style.display = "inline-flex";
      document.getElementById("modal-delete").setAttribute("data-del-id", r.id);
    } else {
      document.getElementById("modal-title").textContent = "기록 추가";
      var catId = (presetIds && presetIds.categoryId) || CATEGORIES[0].id;
      document.getElementById("modal-sub").textContent = itemIndex[presetIds && presetIds.itemId] ? itemIndex[presetIds.itemId].cat.name + " · " + itemIndex[presetIds.itemId].item.name : "";
      fillCategorySelect(catId);
      fillItemSelect(catId, presetIds && presetIds.itemId);
      document.getElementById("f-id").value = "";
      document.getElementById("f-date").value = todayISO();
      document.getElementById("f-status").value = "대기";
      document.getElementById("f-assignee").value = "";
    }
    document.getElementById("modal-backdrop").classList.add("active");
    document.getElementById("f-title").focus();
  }
  function closeModal() { document.getElementById("modal-backdrop").classList.remove("active"); }

  document.getElementById("btn-add-record").addEventListener("click", function () { openModal(null); });
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  document.getElementById("modal-delete").addEventListener("click", function () {
    var id = this.getAttribute("data-del-id");
    if (confirm("이 기록을 삭제할까요?")) {
      state.records = state.records.filter(function (r) { return r.id !== id; });
      saveRecords();
      closeModal();
      refreshAll();
      toast("삭제했습니다.");
    }
  });

  document.getElementById("record-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = document.getElementById("f-id").value;
    var data = {
      categoryId: document.getElementById("f-category").value,
      itemId: document.getElementById("f-item").value,
      title: document.getElementById("f-title").value.trim(),
      date: document.getElementById("f-date").value,
      status: document.getElementById("f-status").value,
      assignee: document.getElementById("f-assignee").value.trim(),
      amount: document.getElementById("f-amount").value ? Number(document.getElementById("f-amount").value) : null,
      quantity: document.getElementById("f-quantity").value ? Number(document.getElementById("f-quantity").value) : null,
      site: document.getElementById("f-site").value.trim(),
      memo: document.getElementById("f-memo").value.trim(),
      updatedAt: Date.now()
    };
    if (id) {
      var idx = state.records.findIndex(function (r) { return r.id === id; });
      state.records[idx] = Object.assign({}, state.records[idx], data);
      toast("수정했습니다.");
    } else {
      data.id = uid();
      data.createdAt = Date.now();
      state.records.push(data);
      toast("추가했습니다.");
    }
    saveRecords();
    closeModal();
    refreshAll();
  });

  /* ---------------- Export / Import ---------------- */
  function toCSV(records) {
    var header = ["카테고리", "상세업무", "제목", "날짜", "담당자", "상태", "금액", "수량", "현장명", "메모"];
    var lines = [header.join(",")];
    records.forEach(function (r) {
      var meta = itemIndex[r.itemId] || {};
      var row = [
        meta.cat ? meta.cat.name : "", meta.item ? meta.item.name : "", r.title, r.date, r.assignee, r.status,
        r.amount || "", r.quantity || "", r.site || "", r.memo || ""
      ].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; });
      lines.push(row.join(","));
    });
    return "﻿" + lines.join("\n");
  }

  function downloadOrFallback(filename, data, mime) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: data }).then(function () {
        toast("다운로드를 저장했습니다.");
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        fallbackDownload(filename, data, mime);
      });
    } else {
      fallbackDownload(filename, data, mime);
    }
  }
  function fallbackDownload(filename, data, mime) {
    var blob = new Blob([data], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("btn-export-csv").addEventListener("click", function () {
    downloadOrFallback("총무팀_업무기록_" + todayISO() + ".csv", toCSV(filteredRecords()), "text/csv");
  });
  document.getElementById("btn-export-json").addEventListener("click", function () {
    downloadOrFallback("총무팀_업무기록_백업_" + todayISO() + ".json", JSON.stringify(state.records, null, 2), "application/json");
  });
  document.getElementById("btn-import").addEventListener("click", function () { document.getElementById("import-input").click(); });
  document.getElementById("import-input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!Array.isArray(incoming)) throw new Error("invalid");
        var existingIds = new Set(state.records.map(function (r) { return r.id; }));
        var added = 0;
        incoming.forEach(function (r) {
          if (r && r.id && !existingIds.has(r.id)) { state.records.push(r); added++; }
        });
        saveRecords();
        refreshAll();
        toast(added + "건을 가져왔습니다.");
      } catch (err) {
        toast("가져오기에 실패했습니다. 올바른 백업 파일인지 확인하세요.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  /* ---------------- Init ---------------- */
  function refreshAll() {
    buildSidebar();
    document.querySelectorAll(".nav-item").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-nav") === state.activeView);
    });
    if (state.activeView === "overview") renderOverview();
    else if (state.activeView === "records") renderRecordsTable();
    else if (state.activeView.indexOf("cat:") === 0) renderCategoryView(state.activeView.slice(4));
  }

  function init() {
    state.records = loadRecords();
    buildCategoryViews();
    buildSidebar();
    setView("overview");
  }

  var existing = getSession();
  if (existing && existing.id) { showApp(existing.id); }
})();
</script>
</body>
</html>
